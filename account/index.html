<main class="kids account" id="root">
  <p class="quiet-link"><a href="../children/index.html">← 孩子档案</a></p>
  <h1>账号与同步</h1>

  <section class="kid-form" id="login-card" aria-labelledby="login-title" hidden>
    <h2 id="login-title">登录家庭账号</h2>
    <p class="muted small">登录后，孩子档案和诊断记录会同步到服务器，家里每台设备登录同一个账号都能看到。账号由管理员在服务器上创建，这里不能注册。</p>
    <form id="login-form" novalidate>
      <label for="l-user">用户名</label>
      <input id="l-user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" required>
      <label for="l-pass">密码</label>
      <div class="pw-row">
        <input id="l-pass" type="password" autocomplete="current-password" maxlength="200" required>
        <button type="button" id="l-toggle" class="pw-toggle" aria-controls="l-pass" aria-pressed="false">显示</button>
      </div>
      <p class="err" id="l-error" role="alert" hidden></p>
      <div class="form-actions">
        <button type="submit" class="primary" id="l-submit">登录</button>
      </div>
    </form>
  </section>

  <section class="kid-form" id="account-card" aria-labelledby="account-title" hidden>
    <h2 id="account-title">已登录</h2>
    <p class="account-user" id="a-user"></p>
    <p data-sync-status></p>
    <div class="form-actions">
      <button type="button" class="primary" id="a-sync">立即同步</button>
    </div>
    <div class="danger-zone">
      <button type="button" class="danger" id="a-logout">退出登录</button>
      <p class="muted small">退出后，这台设备上的档案和记录会清掉，服务器上的不受影响，重新登录就回来了。</p>
    </div>
  </section>
</main>
